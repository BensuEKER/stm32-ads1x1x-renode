name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    name: C Unit Tests (Ceedling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ceedling
        run: gem install ceedling --no-document

      - name: Run tests
        run: ceedling test:all

  firmware-build:
    name: Firmware Build (CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Upload .elf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: build/*.elf
          if-no-files-found: error

  renode-integration-tests:
    name: Renode Integration Tests
    runs-on: ubuntu-latest
    needs: firmware-build
    steps:
      - uses: actions/checkout@v4

      - name: Download .elf artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-elf
          path: firmware-artifact

      - name: Install Renode (portable, bundled .NET)
        run: |
          wget -q https://builds.renode.io/renode-latest.linux-portable-dotnet.tar.gz
          mkdir renode_portable
          tar xf renode-latest.linux-portable-dotnet.tar.gz -C renode_portable --strip-components=1
          echo "$PWD/renode_portable" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Run integration tests
        run: |
          ELF_FILE=$(find firmware-artifact -name '*.elf' | head -n1)
          echo "Found .elf: $ELF_FILE"
          export STM32_ELF="$PWD/$ELF_FILE"
          cd python
          pytest -v test_integration.py
